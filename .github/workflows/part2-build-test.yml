name: Part 2 - Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay/RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build
        run: dotnet build RaceDay/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay/RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build MVC web project
        run: dotnet build RaceDay/RaceDay.Web/RaceDay.Web.csproj --configuration Release

      - name: Build Docker image
        run: docker build -t raceday-web RaceDay/RaceDay.Web
