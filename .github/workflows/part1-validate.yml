name: Validate Part 1 Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD file exists (PNG or PDF)
        run: |
          if [ -z "$(find docs -maxdepth 1 \( -iname '*.png' -o -iname '*.pdf' \) -print -quit)" ]; then
            echo "ERROR: No ERD file (.png or .pdf) found in /docs"
            exit 1
          fi
          echo "ERD file found"

      - name: Check API endpoint plan exists
        run: |
          if [ -z "$(find docs -maxdepth 1 -iname '*endpoint*' -print -quit)" ]; then
            echo "ERROR: No API endpoint plan file found in /docs"
            exit 1
          fi
          echo "API endpoint plan found"

      - name: Check SQL script exists
        run: |
          if [ -z "$(find docs -maxdepth 1 -iname '*.sql' -print -quit)" ]; then
            echo "ERROR: No .sql script found in /docs"
            exit 1
          fi
          echo "SQL script found"
